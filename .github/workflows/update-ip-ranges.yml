name: Update IP Ranges

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:  # Allow manual triggering
    inputs:
      force:
        description: 'Disable max delta guardrail'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-cloud-providers:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Install crawler dependencies
      run: |
        uv sync --directory crawler --no-dev

    - name: Install scripts dependencies
      run: |
        pip install -r scripts/requirements.txt

    - name: Run Update IP ranges (Cloud Providers)
      id: build
      run: |
        set -euo pipefail
        mkdir -p json txt csv
        FORCE_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}"
        MAX_DELTA_FLAG="--max-delta-ratio 0.6"
        if [ "$FORCE_RUN" = "true" ]; then
          MAX_DELTA_FLAG=""
        fi
        uv run --no-dev --directory crawler cloud-ip-ranges --merge-all-providers --add-env-statistics --only-if-changed --suppress-retry-warnings $MAX_DELTA_FLAG --output-format json csv txt --output-dir ../json 2>&1 | tee run.log
        if compgen -G "json/*.txt" > /dev/null; then mv json/*.txt txt/; fi
        if compgen -G "json/*.csv" > /dev/null; then mv json/*.csv csv/; fi
        # Expose the raw log content as a multiline step output
        LOG_PATH=run.log
        {
          echo "log_content<<EOF"
          # Strip leading timestamps (keep the log level and message)
          sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} - //' "$LOG_PATH"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Update retention history
      run: |
        python scripts/update_history.py \
          --db meta/history.duckdb \
          --json-dir json \
          --misc-dir misc

    - name: Update README statistics
      run: |
        python scripts/generate_readme_stats.py \
          --db meta/history.duckdb \
          --readme README.md \
          --json-dir json \
          --misc-dir misc

    - name: Add and commit
      uses: EndBug/add-and-commit@v9
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      with:
        add: 'json txt csv meta/history.duckdb README.md'

        author_name: Auto Update Bot
        author_email: bot@github.com

        message: |
          Updated ${{ steps.build.outputs.sources_count }} cloud services (IPv4: ${{ steps.build.outputs.total_ipv4 }}, IPv6: ${{ steps.build.outputs.total_ipv6 }})

          ${{ steps.build.outputs.log_content }}

  update-misc-providers:
    runs-on: ubuntu-latest
    needs: update-cloud-providers  # Run after cloud providers to avoid conflicts

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Sync with latest master
      run: |
        git pull --ff-only origin master

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Install crawler dependencies
      run: |
        uv sync --directory crawler --no-dev

    - name: Install scripts dependencies
      run: |
        pip install -r scripts/requirements.txt

    - name: Run Update IP ranges (Misc Providers)
      id: build-misc
      run: |
        set -euo pipefail
        mkdir -p misc
        FORCE_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}"
        MAX_DELTA_FLAG="--max-delta-ratio 0.6"
        if [ "$FORCE_RUN" = "true" ]; then
          MAX_DELTA_FLAG=""
        fi
        uv run --no-dev --directory crawler cloud-ip-ranges --merge-all-providers --misc --add-env-statistics --only-if-changed --suppress-retry-warnings $MAX_DELTA_FLAG --output-format json csv txt --output-dir ../misc 2>&1 | tee run-misc.log
        # Expose the raw log content as a multiline step output
        LOG_PATH=run-misc.log
        {
          echo "log_content<<EOF"
          # Strip leading timestamps (keep the log level and message)
          sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} - //' "$LOG_PATH"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Update retention history
      run: |
        python scripts/update_history.py \
          --db meta/history.duckdb \
          --json-dir json \
          --misc-dir misc

    - name: Update README statistics
      run: |
        python scripts/generate_readme_stats.py \
          --db meta/history.duckdb \
          --readme README.md \
          --json-dir json \
          --misc-dir misc

    - name: Add and commit misc providers
      uses: EndBug/add-and-commit@v9
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      with:
        add: 'misc meta/history.duckdb README.md'

        author_name: Auto Update Bot
        author_email: bot@github.com

        message: |
          Updated ${{ steps.build-misc.outputs.sources_count }} misc services (IPv4: ${{ steps.build-misc.outputs.total_ipv4 }}, IPv6: ${{ steps.build-misc.outputs.total_ipv6 }})

          ${{ steps.build-misc.outputs.log_content }}
