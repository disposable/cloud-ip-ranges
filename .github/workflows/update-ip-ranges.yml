name: Update IP Ranges

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:  # Allow manual triggering
    inputs:
      force:
        description: 'Disable max delta guardrail'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-cloud-providers:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up uv
      uses: astral-sh/setup-uv@v3

    - name: Install dependencies
      run: |
        uv sync --directory crawler --no-dev

    - name: Run Update IP ranges (Cloud Providers)
      id: build
      run: |
        mkdir -p json txt csv
        FORCE_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}"
        MAX_DELTA_FLAG="--max-delta-ratio 0.3"
        if [ "$FORCE_RUN" = "true" ]; then
          MAX_DELTA_FLAG=""
        fi
        uv run --no-dev --directory crawler cloud-ip-ranges --add-env-statistics --only-if-changed $MAX_DELTA_FLAG --output-format json csv txt --output-dir ../json 2>&1 | tee run.log
        if compgen -G "json/*.txt" > /dev/null; then mv json/*.txt txt/; fi
        if compgen -G "json/*.csv" > /dev/null; then mv json/*.csv csv/; fi
        # Expose the raw log content as a multiline step output
        LOG_PATH=run.log
        {
          echo "log_content<<EOF"
          # Strip leading timestamps (keep the log level and message)
          sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} - //' "$LOG_PATH"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Add and commit
      uses: EndBug/add-and-commit@v9
      with:
        # The arguments for the `git add` command (see the paragraph below for more info)
        # Default: '.'
        add: 'json txt csv'

        # The name of the user that will be displayed as the author of the commit.
        # Default: depends on the default_author input
        author_name: Auto Update Bot

        # The email of the user that will be displayed as the author of the commit.
        # Default: depends on the default_author input
        author_email: bot@github.com

        # The message for the commit.
        # Default: 'Commit from GitHub Actions (name of the workflow)'
        message: |
          Updated ${{ steps.build.outputs.sources_count }} cloud services (IPv4: ${{ steps.build.outputs.total_ipv4 }}, IPv6: ${{ steps.build.outputs.total_ipv6 }})

          ${{ steps.build.outputs.log_content }}

  update-misc-providers:
    runs-on: ubuntu-latest
    needs: update-cloud-providers  # Run after cloud providers to avoid conflicts

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Sync with latest master
      run: |
        git pull --ff-only origin master

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up uv
      uses: astral-sh/setup-uv@v3

    - name: Install dependencies
      run: |
        uv sync --directory crawler --no-dev

    - name: Run Update IP ranges (Misc Providers)
      id: build-misc
      run: |
        mkdir -p misc
        FORCE_RUN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}"
        MAX_DELTA_FLAG="--max-delta-ratio 0.3"
        if [ "$FORCE_RUN" = "true" ]; then
          MAX_DELTA_FLAG=""
        fi
        uv run --no-dev --directory crawler cloud-ip-ranges --misc --add-env-statistics --only-if-changed $MAX_DELTA_FLAG --output-format json csv txt --output-dir ../misc 2>&1 | tee run-misc.log
        # Expose the raw log content as a multiline step output
        LOG_PATH=run-misc.log
        {
          echo "log_content<<EOF"
          # Strip leading timestamps (keep the log level and message)
          sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} - //' "$LOG_PATH"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Add and commit misc providers
      uses: EndBug/add-and-commit@v9
      with:
        # The arguments for the `git add` command
        add: 'misc'

        # The name of the user that will be displayed as the author of the commit.
        author_name: Auto Update Bot

        # The email of the user that will be displayed as the author of the commit.
        author_email: bot@github.com

        # The message for the commit.
        message: |
          Updated ${{ steps.build-misc.outputs.sources_count }} misc services (IPv4: ${{ steps.build-misc.outputs.total_ipv4 }}, IPv6: ${{ steps.build-misc.outputs.total_ipv6 }})

          ${{ steps.build-misc.outputs.log_content }}
