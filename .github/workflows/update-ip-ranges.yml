name: Update IP Ranges

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  update-ip-ranges:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up uv
      uses: astral-sh/setup-uv@v3

    - name: Install dependencies
      run: |
        uv sync --directory crawler --no-dev

    - name: Run Update IP ranges
      id: build
      run: |
        mkdir -p json txt csv
        cd json
        uv run --directory ../crawler cloud-ip-ranges --add-env-statistics --only-if-changed --output-format json csv txt 2>&1 | tee ../run.log
        mv *.txt ../txt 2>&1 || true
        mv *.csv ../csv 2>&1 || true
        # Expose the raw log content as a multiline step output
        LOG_PATH=../run.log
        {
          echo "log_content<<EOF"
          # Strip leading timestamps (keep the log level and message)
          sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} - //' "$LOG_PATH"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Add and commit
      uses: EndBug/add-and-commit@v9
      with:
        # The arguments for the `git add` command (see the paragraph below for more info)
        # Default: '.'
        add: 'json txt csv'

        # The name of the user that will be displayed as the author of the commit.
        # Default: depends on the default_author input
        author_name: Auto Update Bot

        # The email of the user that will be displayed as the author of the commit.
        # Default: depends on the default_author input
        author_email: bot@github.com

        # The message for the commit.
        # Default: 'Commit from GitHub Actions (name of the workflow)'
        message: |
          Updated ${{ steps.build.outputs.sources_count }} services (IPv4: ${{ steps.build.outputs.total_ipv4 }}, IPv6: ${{ steps.build.outputs.total_ipv6 }})

          ${{ steps.build.outputs.log_content }}
